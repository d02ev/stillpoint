[project]
name = "stillpoint"
version = "0.1.0"
description = "A tiny, gentle desktop studio for making meditation videos and audio."
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0",
    "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]

[dependency-groups]
dev = ["pytest", "pyinstaller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stillpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
stillpoint = "stillpoint.gui.app:run"
build-exe = "build_exe:main"
